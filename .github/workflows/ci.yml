name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies (Redir Engine)
        working-directory: redir-engine
        run: npm install

      - name: Install Dependencies (E2E Suite)
        working-directory: redir-engine/e2e-suite
        run: npm install

      - name: Build Engine (Node)
        working-directory: redir-engine
        run: npm run build

      - name: Run Unit Tests (Redir Engine)
        working-directory: redir-engine
        run: npm run test

      - name: Run Tests (Node Runtime)
        working-directory: redir-engine/e2e-suite
        run: npm run test:node
        env:
          E2E_QUICK_MODE: 'true'

      - name: Run Tests (Cloudflare Worker Runtime)
        working-directory: redir-engine/e2e-suite
        run: npm run test:cf

      - name: Install Dependencies (Admin Service)
        working-directory: admin-service/supabase
        run: npm install

      - name: Run Tests (Admin Service)
        working-directory: admin-service/supabase
        run: npm run test

  pocketbase-test:
    name: PocketBase Migration & Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'admin-service/pocketbase/package-lock.json'

      - name: Install PocketBase 0.25.0
        run: |
          curl -sL -o pocketbase.zip https://github.com/pocketbase/pocketbase/releases/download/v0.25.0/pocketbase_0.25.0_linux_amd64.zip
          unzip -q pocketbase.zip -d "$RUNNER_TEMP/pocketbase"
          chmod +x "$RUNNER_TEMP/pocketbase/pocketbase"
          echo "POCKETBASE_BIN=$RUNNER_TEMP/pocketbase/pocketbase" >> "$GITHUB_ENV"

      - name: Install Dependencies (PocketBase)
        working-directory: admin-service/pocketbase
        run: npm install

      - name: Run Tests (PocketBase)
        working-directory: admin-service/pocketbase
        run: npm test
